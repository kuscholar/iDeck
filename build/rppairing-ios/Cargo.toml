[package]
name = "madeira_rppairing"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
idevice = { version = "=0.1.68", default-features = false, features = ["remote_pairing", "ring"] }
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
