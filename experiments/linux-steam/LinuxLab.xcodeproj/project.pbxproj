			<key>shellScript</key>
			<string>set -euo pipefail
cp "$LINUX_LAB_BUILD_DIR/probe.elf" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/probe.elf"

cp "$LINUX_LAB_BUILD_DIR/packet-probe.elf" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/packet-probe.elf"

cp "$LINUX_LAB_BUILD_DIR/tcp-probe.elf" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/tcp-probe.elf"

compatibility="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/LabCompatibility"
if [[ ${LINUX_LAB_COMPAT_TOOL:-0} == 1 ]];then
    [[ ${LINUX_LAB_STEAM_FRONTEND:-0} == 1 ]] || { echo 'Compatibility resources require the Steam frontend' &gt;&amp;2;exit 2; }
    mkdir -p "$compatibility"
    cp "$LINUX_LAB_BUILD_DIR/ideck-madeira" "$compatibility/ideck-madeira"
    cp "$SRCROOT/compatibilitytool.vdf" "$SRCROOT/toolmanifest.vdf" "$compatibility/"
else
    # Remove ONLY the three generated resources when reusing DerivedData.
    # Never recursively remove unknown files or any app data/container.
    rm -f "$compatibility/ideck-madeira" "$compatibility/compatibilitytool.vdf" "$compatibility/toolmanifest.vdf"
    if [[ -d "$compatibility" ]];then rmdir "$compatibility" 2&gt;/dev/null || true;fi
fi

diagnostics="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/LabDiagnostics"
if [[ ${LINUX_LAB_X11_TRACE:-0} == 1 ]];then
    [[ ${LINUX_LAB_STEAM_FRONTEND:-0} == 1 &amp;&amp; ${LINUX_LAB_COMPAT_TOOL:-0} == 1 &amp;&amp; ${LINUX_LAB_NATIVE_LOG:-0} == 1 ]] || { echo 'Window diagnostics require frontend, tool and native logging' &gt;&amp;2;exit 2; }
    mkdir -p "$diagnostics"
    cp "$LINUX_LAB_BUILD_DIR/xlib-window-trace.so" "$diagnostics/xlib-window-trace.so"
else
    rm -f "$diagnostics/xlib-window-trace.so"
    if [[ -d "$diagnostics" ]];then rmdir "$diagnostics" 2&gt;/dev/null || true;fi
fi
